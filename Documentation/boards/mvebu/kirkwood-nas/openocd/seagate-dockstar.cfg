#
# OpenOCD board file for the Seagate FreeAgent DockStar
#
# Usage: openocd -f <your-adapter.cfg> -f seagate-dockstar.cfg \
#                -c "init; kw_boot_ram barebox-seagate-dockstar-2nd.img; shutdown"

set KW_BOARD seagate_dockstar

# MPP setup as done by U-Boot for this board
set KW_MPP_CTRL0 0x01111111	;# MPP0-5 NAND, MPP6 SYSRST_OUTn, MPP7 GPO
set KW_MPP_CTRL1 0x11113322	;# MPP8/9 UART0 RTS/CTS, MPP10/11 UART0, MPP12-15 SDIO
set KW_MPP_CTRL2 0x00001111	;# MPP16/17 SDIO, MPP18/19 NAND IO0/1

source [file join [file dirname [info script]] seagate-dockstar-ddr.tcl]
source [file join [file dirname [info script]] kirkwood-nas.tcl]
