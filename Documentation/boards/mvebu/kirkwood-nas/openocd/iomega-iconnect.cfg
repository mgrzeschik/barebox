#
# OpenOCD board file for the Iomega iConnect
#
# Usage: openocd -f <your-adapter.cfg> -f iomega-iconnect.cfg \
#                -c "init; kw_boot_ram barebox-iomega-iconnect-2nd.img; shutdown"

set KW_BOARD iomega_iconnect

# MPP setup as done by U-Boot for this board
set KW_MPP_CTRL0 0x01111111	;# MPP0-5 NAND, MPP6 SYSRST_OUTn, MPP7 GPO
set KW_MPP_CTRL1 0x11103311	;# MPP8/9 I2C, MPP10/11 UART0, MPP12 GPIO, MPP13-15 SDIO
set KW_MPP_CTRL2 0x00001111	;# MPP16/17 SDIO, MPP18/19 NAND IO0/1

source [file join [file dirname [info script]] iomega-iconnect-ddr.tcl]
source [file join [file dirname [info script]] kirkwood-nas.tcl]
