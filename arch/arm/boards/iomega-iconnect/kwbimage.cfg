#
# Kirkwood BootROM header for the Iomega iConnect
#
# DDR2 setup taken from U-Boot board/iomega/iconnect/kwbimage.cfg
#   (C) 2009-2012 Wojciech Dubowik <wojciech.dubowik@neratec.com>,
#                  Luka Perkov <luka@openwrt.org>
#
# Kirkwood (88F6281) only understands version 0 headers. Version 1
# headers are for Armada 370/XP and are rejected by this BootROM.
#
# Note: The kwbimage parser only skips lines that *start* with '#'.
# Trailing comments after DATA values are tolerated because strtoul()
# stops at the first non-hex character.

VERSION 0
BOOT_FROM nand
NAND_ECCMODE default
NAND_PAGESZ 00000800

# RGMII-0 pad voltage 1.8V
DATA ffd100e0 1b1b1b9b

# DDR2 SDRAM, CL=5 @ 400MHz, 256 MiB decoded through CS0
DATA ffd01400 43000c30	# DDR Configuration: refresh 0xc30 clks, exit SR on access
DATA ffd01404 37543000	# DDR Controller Control Low: CL=5, CL+2 STARTBURST
DATA ffd01408 22125451	# DDR Timing Low
DATA ffd0140c 00000a33	# DDR Timing High
DATA ffd01410 000000cc	# DDR Address Control: CS0+CS1 x8, 1Gb devices
DATA ffd01414 00000000	# DDR Open Pages Control: enabled
DATA ffd01418 00000000	# DDR Operation: normal
DATA ffd0141c 00000c52	# DDR Mode: BL=4, CL=5, WR=6
DATA ffd01420 00000040	# DDR Extended Mode: DLL on, ODT 150 Ohm disabled
DATA ffd01424 0000f17f	# DDR Controller Control High: write path sample stage
DATA ffd01428 00085520	# DDR2 ODT Read Timing
DATA ffd0147c 00008552	# DDR2 ODT Write Timing

# SDRAM address decoding windows. barebox derives the RAM size it hands
# to the kernel from these registers (kirkwood_memory_find()), so they
# must describe the physical memory exactly: CS0 @ 0x0, 256 MiB.
DATA ffd01500 00000000	# CS0 base 0x00000000
DATA ffd01504 0ffffff1	# CS0 size 256 MiB, window enabled
DATA ffd01508 00000000	# CS1 base (unused)
DATA ffd0150c 00000000	# CS1 window disabled
DATA ffd01514 00000000	# CS2 window disabled
DATA ffd0151c 00000000	# CS3 window disabled

DATA ffd01494 00030000	# DDR ODT Control Low
DATA ffd01498 00000000	# DDR ODT Control High
DATA ffd0149c 0000e803	# CPU ODT Control
DATA ffd01480 00000001	# DDR Initialization Control: start init
